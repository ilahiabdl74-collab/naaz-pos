<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAAZ POS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a3aa8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NAAZ POS">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bl:#0a3aa8;--bl2:#1a56db;--bg:#eaf0fb;--card:#fff;--ink:#14213d;--mut:#5b6b8c;--line:#d5def0;--r:#d9342b;--g:#1c9c45;--p:#7b3fc4;--o:#f0911b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18233a;--ink:#eaf0ff;--mut:#9db0d4;--line:#2b3a58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18233a;--ink:#eaf0ff;--mut:#9db0d4;--line:#2b3a58;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
.app{display:grid;grid-template-columns:180px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0a3aa8,#06235f);padding:14px 10px}
aside button{display:flex;gap:10px;align-items:center;width:100%;padding:12px;margin-bottom:6px;border:0;border-radius:12px;background:none;color:#fff;font-size:16px;text-align:left}
aside button.on{background:rgba(255,255,255,.2);font-weight:700}
.top{background:linear-gradient(90deg,#0a3aa8,#1a56db);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px}
#hl{height:56px;max-width:90px;object-fit:contain}
#sn{font-weight:800;font-size:20px;line-height:1.15}
#tg{font-style:italic;font-size:13px;opacity:.9}
#q{flex:1;max-width:420px;margin-left:auto;padding:10px 16px;border:0;border-radius:99px;min-width:0}
#clk{text-align:right;font-weight:700;white-space:nowrap;font-size:14px}
section{padding:14px}
.home{display:grid;grid-template-columns:1fr 380px;gap:14px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.cats button{flex:none;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
.cats button.on{background:var(--bl2);color:#fff;border-color:var(--bl2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin-top:8px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;color:inherit;cursor:pointer;position:relative;transition:transform .12s}
.card:active,.bt:active{transform:scale(.96)}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:contain;display:block;border-radius:8px}
.ph{background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--bl2);font-weight:800}
.card b{display:block;font-size:14px;margin-top:4px}
.card span{color:var(--bl2);font-weight:700;font-size:14px}
.badge{position:absolute;top:6px;right:6px;background:var(--bl2);color:#fff;border-radius:99px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;animation:pop .3s}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.bill{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;align-self:start;position:sticky;top:10px}
.bill h2{margin:0;padding:12px 14px;background:var(--bl);color:#fff;font-size:20px}
.lines{min-height:180px;max-height:38vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--bl);color:#fff;padding:6px;font-weight:600;position:sticky;top:0}
td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
.q button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tl{display:flex;justify-content:space-between;align-items:center;padding:5px 14px;color:var(--mut)}
.tl input{width:100px;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;text-align:right;background:var(--bg);color:var(--ink)}
.tt{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:700;font-size:17px}
.amt{background:var(--bl);color:#fff;padding:8px 16px;border-radius:10px;font-size:21px;font-weight:800}
.row{display:grid;gap:8px;padding:4px 14px 8px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}
.bt{border:0;border-radius:10px;padding:12px 6px;color:#fff;font-weight:700;transition:transform .12s}
.red{background:var(--r)}.blue{background:var(--bl2)}.grn{background:var(--g)}.pur{background:var(--p)}.org{background:var(--o)}
.pay{opacity:.55}.pay.on{opacity:1;outline:3px solid var(--ink)}
.prt{background:var(--bl);font-size:18px;padding:14px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;max-width:720px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
.panel input[type=text],.panel input[type=number],.panel input[type=date],.panel input[type=month],.panel select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ir{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ir .ph,.ir img{width:46px;height:46px;flex:none;font-size:18px}
.ir .n{flex:1;min-width:0}
.sm{border:0;border-radius:8px;padding:7px 12px;background:var(--bg);color:var(--bl2);font-weight:600}
.sm.d{color:var(--r)}
.sub{display:flex;gap:6px;margin-bottom:10px;max-width:720px}.sub .bt{flex:1;background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.sub .bt.on{background:var(--bl2);color:#fff;border-color:var(--bl2)}
.sum{font-size:34px;font-weight:800;color:var(--bl2)}
.bl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:8px}
.bg{height:10px;background:var(--bl2);border-radius:6px;transform-origin:left;animation:grow .8s both;margin-top:2px}
@keyframes grow{from{transform:scaleX(0)}}
.empty{color:var(--mut);text-align:center;padding:24px 8px;grid-column:1/-1}
.hide{display:none!important}
.mini{display:none}
#splash{position:fixed;inset:0;background:#0a3aa8;color:#fff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;text-align:center;padding:20px}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:110px;height:110px;object-fit:contain;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
#splash .s1{font-size:26px;font-weight:800;animation:rise .8s .4s both}
#splash .s2{font-style:italic;animation:rise .8s .7s both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;color:#000;background:#fff;max-width:300px;margin:0 auto;font-size:13px}#pr table{font-size:13px}#pr th{background:none;color:#000;border-bottom:1px solid #000}#pr td{padding:3px 0;text-align:left;border:0}#pr .r{text-align:right}#pr h3{text-align:center;margin:0}}
@media(max-width:899px){
 .app{display:block;padding-bottom:70px}
 aside{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
 aside button{flex-direction:column;gap:0;font-size:12px;padding:6px 2px;margin:0;text-align:center;justify-content:center}
 .home{grid-template-columns:1fr}.bill{position:static}
 #clk,#tg{display:none}#sn{font-size:16px}#hl{height:44px}
 .mini{display:flex;position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--bl2);color:#fff;border-radius:12px;padding:10px 14px;justify-content:space-between;font-weight:700}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"></div>
<div class="app">
<aside>
 <button id="n1" class="on" onclick="nav(1)">🏠 Home</button>
 <button id="n2" onclick="nav(2)">📦 Inventory</button>
 <button id="n3" onclick="nav(3)">📊 Reports</button>
 <button id="n4" onclick="nav(4)">⚙️ Settings</button>
</aside>
<div>
<header class="top"><img id="hl" alt=""><div><div id="sn"></div><div id="tg"></div></div><input id="q" type="search" placeholder="Search Products..." oninput="qs=this.value.toLowerCase();render()"><div id="clk"></div></header>

<section id="v1" class="home">
 <div><div id="cats" class="cats"></div><div id="grid" class="grid"></div></div>
 <div class="bill" id="billbox">
  <h2>Current Bill</h2>
  <div class="lines"><table><thead><tr><th>#</th><th>Item Name</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody id="lines"></tbody></table></div>
  <div class="tl"><span>Discount (Rs.)</span><input id="disc" type="number" inputmode="decimal" placeholder="0.00" oninput="disc=parseFloat(this.value)||0;totals()"></div>
  <div class="tl"><span id="txl">Tax (VAT)</span><span id="tx"></span></div>
  <div class="tt"><span>Total Amount</span><span class="amt" id="amt"></span></div>
  <div class="row r2"><button class="bt red" onclick="clr()">🗑 Clear</button><button class="bt blue" id="hold" onclick="hold()">Hold</button></div>
  <div class="row r3"><button class="bt grn pay" data-p="Cash" onclick="setPay('Cash')">Cash</button><button class="bt pur pay" data-p="Card" onclick="setPay('Card')">Card</button><button class="bt org pay" data-p="QR Pay" onclick="setPay('QR Pay')">QR Pay</button></div>
  <div class="row"><button class="bt prt" onclick="printBill()">🖨 Print Bill ›</button></div>
 </div>
</section>

<section id="v2" class="hide">
 <div class="panel"><b>Add product</b>
  <label>Name</label><input type="text" id="nn">
  <label>Price (Rs.)</label><input type="number" id="np" inputmode="decimal">
  <label>Category</label><select id="nc"></select>
  <label>Photo</label><input type="file" id="nf" accept="image/*">
  <p style="margin:12px 0 0"><button class="bt blue" style="padding:10px 22px" onclick="newItem()">Add</button></p></div>
 <div class="panel" id="inv"></div>
</section>

<section id="v3" class="hide">
 <div class="sub"><button id="bd" class="bt on" onclick="rep('d')">Day</button><button id="bm" class="bt" onclick="rep('m')">Month</button><button id="by" class="bt" onclick="rep('y')">Year</button></div>
 <div class="panel"><input type="date" id="ed" onchange="rep()"><input type="month" id="em" class="hide" onchange="rep()"><input type="number" id="ey" class="hide" oninput="rep()"></div>
 <div class="panel" id="rp"></div>
</section>

<section id="v4" class="hide">
 <div class="panel"><label style="margin-top:0">Shop name</label><input type="text" id="sin" oninput="setS()">
  <label>Tagline</label><input type="text" id="stg" oninput="setS()">
  <label>Tax / VAT (%)</label><input type="number" id="stx" inputmode="decimal" oninput="setS()">
  <label>Logo</label><input type="file" id="lf" accept="image/*" onchange="setLogo()"></div>
</section>
</div>
</div>
<div class="mini" id="mini" onclick="$('billbox').scrollIntoView({behavior:'smooth'})"></div>
<div id="pr"></div>
<script>

function er(){alert("Could not save")}

function pushSettings(){sv("shop",shop);sv("tag",tag);sv("tax",tax);sv("logo",logo);if(DB)DB.doc("settings/main").set({shop:shop,tag:tag,tax:tax,logo:logo}).catch(er)}
function rs(f,s,t,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(s/im.width,s/im.height,1),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(t,.75))};im.src=r.result};r.readAsDataURL(f)}

function setCat(c){cat=c;render()}
function tap(id){cart[id]=(cart[id]||0)+1;render()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()}
function setPay(p){pay=p;pays()}
function pays(){document.querySelectorAll(".pay").forEach(function(b){b.classList.toggle("on",b.dataset.p==pay)})}
function clr(){cart={};disc=0;$("disc").value="";render()}
function hold(){if(Object.keys(cart).length){holds.push({c:cart,d:disc});cart={};disc=0;$("disc").value=""}else if(holds.length){var h=holds.pop();cart=h.c;disc=h.d;$("disc").value=h.d||""}render()}
function calc(){var s=0;items.forEach(function(i){s+=(cart[i.id]||0)*i.price});var d=Math.min(disc,s),t=(s-d)*tax/100;return{s:s,d:d,tx:t,tot:s-d+t}}
function totals(){var c=calc(),n=0;for(var k in cart)n+=cart[k];$("tx").textContent=m(c.tx);$("amt").textContent=m(c.tot);$("mini").innerHTML="<span>"+n+" items</span><span>"+m(c.tot)+" · View bill</span>"}
function render(){
 var cs=["All"].concat(CATS.filter(function(c){return items.some(function(i){return(i.cat||"Others")==c})}));if(cs.indexOf(cat)<0)cat="All";
 $("cats").innerHTML=cs.map(function(c){return'<button class="'+(c==cat?"on":"")+'" data-c="'+esc(c)+'" onclick="setCat(this.dataset.c)">'+esc(c)+'</button>'}).join("");
 var v=items.filter(function(i){return(cat=="All"||(i.cat||"Others")==cat)&&i.name.toLowerCase().indexOf(qs)>=0});
 $("grid").innerHTML=v.length?v.map(function(i){return'<button class="card" onclick="tap('+i.id+')">'+im(i)+(cart[i.id]?'<div class="badge">'+cart[i.id]+'</div>':'')+'<b>'+esc(i.name)+'</b><span>'+m(i.price)+'</span></button>'}).join(""):'<div class="empty">No products yet. Add them in Inventory.</div>';
 $("lines").innerHTML=items.filter(function(i){return cart[i.id]}).map(function(i,n){return'<tr><td>'+(n+1)+'</td><td style="text-align:left">'+esc(i.name)+'</td><td class="q"><button onclick="chg('+i.id+',-1)">−</button> '+cart[i.id]+' <button onclick="chg('+i.id+',1)">+</button></td><td>'+i.price+'</td><td>'+i.price*cart[i.id]+'</td></tr>'}).join("");
 $("hold").textContent=(!Object.keys(cart).length&&holds.length)?"Resume ("+holds.length+")":holds.length?"Hold ("+holds.length+")":"Hold";
 $("nc").innerHTML=CATS.map(function(c){return'<option>'+esc(c)+'</option>'}).join("");
 $("inv").innerHTML=items.length?items.map(function(i){return'<div class="ir">'+im(i)+'<div class="n"><b>'+esc(i.name)+'</b><br><span style="color:var(--mut)">'+esc(i.cat||"Others")+' · '+m(i.price)+'</span></div><button class="sm" onclick="editPrice('+i.id+')">Price</button><button class="sm d" onclick="delItem('+i.id+')">Delete</button></div>'}).join(""):'<div class="empty">No products yet</div>';
 pays();totals()}
function printBill(){
 var ls=items.filter(function(i){return cart[i.id]});if(!ls.length){alert("Select products first");return}
 var c=calc(),d=new Date(),rec={t:Date.now(),sub:c.s,disc:c.d,tax:c.tx,tot:c.tot,pay:pay,l:ls.map(function(i){return{n:i.name,q:cart[i.id],a:i.price*cart[i.id]}})};
 $("pr").innerHTML='<h3>'+esc(shop)+'</h3><div style="text-align:center">'+esc(tag)+'<br>'+d.toLocaleString("en-IN")+'</div><table><tr><th>Item</th><th class="r">Qty</th><th class="r">Amt</th></tr>'+rec.l.map(function(l){return'<tr><td>'+esc(l.n)+'</td><td class="r">'+l.q+'</td><td class="r">'+l.a+'</td></tr>'}).join("")+'</table><hr>Subtotal: '+m(c.s)+'<br>Discount: '+m(c.d)+'<br>Tax: '+m(c.tx)+'<br><b>Total: '+m(c.tot)+'</b><br>Paid by: '+pay+'<p style="text-align:center">Thank you for shopping with us!</p>';
 if(DB)DB.collection("sales").add(rec).catch(er);else{sales.push(rec);sv("sales",sales)}
 window.print();clr()}
function rep(x){rm=x||rm;["d","m","y"].forEach(function(k){$("b"+k).classList.toggle("on",k==rm);$("e"+k).classList.toggle("hide",k!=rm)});
 var p=$("e"+rm).value,s=sales.filter(function(a){return p&&dk(a.t).indexOf(p)==0}),tot=0,it={},gr={},py={};
 s.forEach(function(a){tot+=a.tot;var g=rm=="y"?dk(a.t).slice(0,7):dk(a.t);gr[g]=(gr[g]||0)+a.tot;var q=a.pay||"Cash";py[q]=(py[q]||0)+a.tot;a.l.forEach(function(l){var o=it[l.n]||(it[l.n]={q:0,a:0});o.q+=l.q;o.a+=l.a})});
 if(!s.length){$("rp").innerHTML='<div class="empty">No bills in this period</div>';return}
 var mx=Math.max.apply(null,Object.keys(gr).map(function(k){return gr[k]})),h='<div style="color:var(--mut)">Total sales · '+s.length+' bills</div><div class="sum" id="cu">Rs. 0.00</div>';
 h+='<p style="margin:6px 0">'+Object.keys(py).map(function(k){return k+': <b>'+m(py[k])+'</b>'}).join(" &nbsp; ")+'</p>';
 if(rm!="d")h+='<b>'+(rm=="y"?"By month":"By day")+'</b>'+Object.keys(gr).sort().map(function(k){return'<div class="bl"><span>'+k+'</span><b>'+m(gr[k])+'</b></div><div class="bg" style="width:'+Math.max(3,gr[k]/mx*100)+'%"></div>'}).join("");
 h+='<p style="margin:16px 0 0"><b>By product</b></p>'+Object.keys(it).sort(function(a,b){return it[b].a-it[a].a}).map(function(k){return'<div class="bl"><span>'+esc(k)+' × '+it[k].q+'</span><b>'+m(it[k].a)+'</b></div>'}).join("");
 $("rp").innerHTML=h;var el=$("cu"),t0=performance.now();(function f(t){var r=Math.min(1,(t-t0)/800);el.textContent=m(tot*r);if(r<1)requestAnimationFrame(f)})(t0)}
function clock(){var d=new Date();$("clk").innerHTML=d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})+"<br>"+d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
var now=dk(Date.now());$("ed").value=now;$("em").value=now.slice(0,7);$("ey").value=now.slice(0,4);
clock();setInterval(clock,20000);fill();head();render();
var sp=$("splash");sp.innerHTML='<img src="'+(logo||DL)+'" alt=""><div class="s1">'+esc(shop)+'</div><div class="s2">'+esc(tag)+'</div>';
setTimeout(function(){sp.classList.add("out");setTimeout(function(){sp.remove()},600)},1800);
(window.claude&&claude.use?claude.use("db"):Promise.resolve(null)).then(function(d){
 if(!d)return;DB=d;
 DB.collection("items").onSnapshot(function(s){items=s.docs.map(function(x){return Object.assign({},x.data())}).sort(function(a,b){return a.id-b.id});render()},function(){});
 DB.collection("sales").onSnapshot(function(s){sales=s.docs.map(function(x){return x.data()});if(!$("v3").classList.contains("hide"))rep()},function(){});
 DB.doc("settings/main").onSnapshot(function(s){if(s.exists){var v=s.data();shop=v.shop||shop;tag=v.tag||tag;tax=v.tax||0;logo=v.logo||"";fill();head()}},function(){});
 if(!ld("mig",0)){ld("items",[]).forEach(putItem);ld("sales",[]).forEach(function(x){DB.collection("sales").add(x).catch(er)});if(ld("shop","")||logo)pushSettings();sv("mig",1)}
});
</script>
